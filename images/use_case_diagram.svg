<svg width="1040" height="750" viewBox="0 0 1040 750" xmlns="http://www.w3.org/2000/svg" style="background:#ffffff; font-family:'Times New Roman', 'Segoe UI', serif, sans-serif;">
    <defs>
        <!-- Black Arrow Marker -->
        <marker id="arrow-black" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
        </marker>
    </defs>

    <!-- ================= SYSTEM BOUNDARY ================= -->
    <rect x="180" y="25" width="680" height="700" rx="0" fill="#ffffff" stroke="#000000" stroke-width="2"/>
    
    <!-- Boundary Title Box -->
    <rect x="180" y="25" width="680" height="38" fill="#f4f4f4" stroke="#000000" stroke-width="1.5"/>
    <text x="520" y="50" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000" letter-spacing="1">
        HỆ THỐNG WEBSITE TECHZONE (System Boundary)
    </text>

    <!-- ================= ACTOR 1: KHÁCH HÀNG (LEFT) ================= -->
    <g id="actor-user" transform="translate(85, 300)">
        <!-- Head -->
        <circle cx="0" cy="-35" r="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <!-- Body -->
        <line x1="0" y1="-19" x2="0" y2="35" stroke="#000000" stroke-width="2"/>
        <!-- Arms -->
        <line x1="-30" y1="2" x2="30" y2="2" stroke="#000000" stroke-width="2"/>
        <!-- Left Leg -->
        <line x1="0" y1="35" x2="-22" y2="85" stroke="#000000" stroke-width="2"/>
        <!-- Right Leg -->
        <line x1="0" y1="35" x2="22" y2="85" stroke="#000000" stroke-width="2"/>
        <!-- Label -->
        <text x="0" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Khách hàng</text>
        <text x="0" y="128" text-anchor="middle" font-size="12" fill="#000000">(User / Guest)</text>
    </g>

    <!-- ================= ACTOR 2: ADMIN (RIGHT) ================= -->
    <g id="actor-admin" transform="translate(955, 300)">
        <!-- Head -->
        <circle cx="0" cy="-35" r="16" fill="#ffffff" stroke="#000000" stroke-width="2"/>
        <!-- Body -->
        <line x1="0" y1="-19" x2="0" y2="35" stroke="#000000" stroke-width="2"/>
        <!-- Arms -->
        <line x1="-30" y1="2" x2="30" y2="2" stroke="#000000" stroke-width="2"/>
        <!-- Left Leg -->
        <line x1="0" y1="35" x2="-22" y2="85" stroke="#000000" stroke-width="2"/>
        <!-- Right Leg -->
        <line x1="0" y1="35" x2="22" y2="85" stroke="#000000" stroke-width="2"/>
        <!-- Label -->
        <text x="0" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000">Quản trị viên</text>
        <text x="0" y="128" text-anchor="middle" font-size="12" fill="#000000">(Admin)</text>
    </g>

    <!-- ================= ASSOCIATION LINES (User to Use Cases) ================= -->
    <line x1="85" y1="300" x2="215" y2="100" stroke="#000000" stroke-width="1.5"/>
    <line x1="85" y1="300" x2="208" y2="165" stroke="#000000" stroke-width="1.5"/>
    <line x1="85" y1="300" x2="212" y2="230" stroke="#000000" stroke-width="1.5"/>
    <line x1="85" y1="300" x2="218" y2="295" stroke="#000000" stroke-width="1.5"/>
    <!-- Nối Khách hàng đến ĐĂNG NHẬP Ở CHÍNH GIỮA -->
    <line x1="85" y1="300" x2="410" y2="340" stroke="#000000" stroke-width="1.8"/>
    <line x1="85" y1="300" x2="215" y2="430" stroke="#000000" stroke-width="1.5"/>
    <line x1="85" y1="300" x2="208" y2="505" stroke="#000000" stroke-width="1.5"/>
    <line x1="85" y1="300" x2="210" y2="580" stroke="#000000" stroke-width="1.5"/>
    <line x1="85" y1="300" x2="210" y2="650" stroke="#000000" stroke-width="1.5"/>

    <!-- ================= ASSOCIATION LINES (Admin to Use Cases) ================= -->
    <!-- Nối Admin đến ĐĂNG NHẬP Ở CHÍNH GIỮA -->
    <line x1="955" y1="300" x2="630" y2="340" stroke="#000000" stroke-width="1.8"/>
    <line x1="955" y1="300" x2="835" y2="120" stroke="#000000" stroke-width="1.5"/>
    <line x1="955" y1="300" x2="838" y2="200" stroke="#000000" stroke-width="1.5"/>
    <line x1="955" y1="300" x2="830" y2="280" stroke="#000000" stroke-width="1.5"/>
    <line x1="955" y1="300" x2="832" y2="440" stroke="#000000" stroke-width="1.5"/>
    <line x1="955" y1="300" x2="820" y2="620" stroke="#000000" stroke-width="1.5"/>

    <!-- ================= <<INCLUDE>> RELATIONSHIPS ================= -->
    <!-- UC7 (Thanh toán) include UC6 (Giỏ hàng) -->
    <path d="M 320 483 L 320 453" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-black)"/>
    <text x="328" y="470" font-size="11" font-weight="bold" fill="#000000">&lt;&lt;include&gt;&gt;</text>

    <!-- UC7 (Thanh toán) include UC_LOGIN (Đăng nhập ở giữa) -->
    <path d="M 370 485 L 460 365" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-black)"/>
    <text x="425" y="430" font-size="11" font-weight="bold" fill="#000000">&lt;&lt;include&gt;&gt;</text>

    <!-- UC8 (Xem lịch sử) include UC_LOGIN (Đăng nhập ở giữa) -->
    <path d="M 370 560 L 485 365" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-black)"/>
    <text x="445" y="480" font-size="11" font-weight="bold" fill="#000000">&lt;&lt;include&gt;&gt;</text>

    <!-- UC10 (Thống kê Dashboard) include UC_LOGIN (Đăng nhập ở giữa) -->
    <path d="M 670 142 L 565 315" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-black)"/>
    <text x="618" y="225" font-size="11" font-weight="bold" fill="#000000">&lt;&lt;include&gt;&gt;</text>

    <!-- UC12 (QL Đơn hàng) include UC13 (Cập nhật trạng thái) -->
    <path d="M 720 303 L 720 337" stroke="#000000" stroke-width="1.5" stroke-dasharray="5 3" marker-end="url(#arrow-black)"/>
    <text x="728" y="323" font-size="11" font-weight="bold" fill="#000000">&lt;&lt;include&gt;&gt;</text>

    <!-- ================= USE CASES: CỘT TRÁI (KHÁCH HÀNG) ================= -->
    <!-- UC1 -->
    <g transform="translate(320, 100)">
        <ellipse cx="0" cy="0" rx="105" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Xem Banner &amp; Slider</text>
    </g>
    <!-- UC2 -->
    <g transform="translate(320, 165)">
        <ellipse cx="0" cy="0" rx="112" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Tìm kiếm &amp; Lọc sản phẩm</text>
    </g>
    <!-- UC3 -->
    <g transform="translate(320, 230)">
        <ellipse cx="0" cy="0" rx="108" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Xem chi tiết sản phẩm</text>
    </g>
    <!-- UC4 -->
    <g transform="translate(320, 295)">
        <ellipse cx="0" cy="0" rx="102" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Đăng ký tài khoản</text>
    </g>
    <!-- UC6 -->
    <g transform="translate(320, 430)">
        <ellipse cx="0" cy="0" rx="105" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Quản lý giỏ hàng</text>
    </g>
    <!-- UC7 -->
    <g transform="translate(320, 505)">
        <ellipse cx="0" cy="0" rx="112" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Đặt hàng &amp; Thanh toán</text>
    </g>
    <!-- UC8 -->
    <g transform="translate(320, 580)">
        <ellipse cx="0" cy="0" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Xem lịch sử đơn hàng</text>
    </g>
    <!-- UC9 -->
    <g transform="translate(320, 650)">
        <ellipse cx="0" cy="0" rx="110" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Quản lý hồ sơ cá nhân</text>
    </g>

    <!-- ================= USE CASE TRUNG TÂM Ở CHÍNH GIỮA (CENTER LOGIN) ================= -->
    <g id="uc-login-center" transform="translate(520, 340)">
        <!-- Double outline hoặc viền đậm nổi bật ở chính giữa -->
        <ellipse cx="0" cy="0" rx="112" ry="25" fill="#fcfcfc" stroke="#000000" stroke-width="2.5"/>
        <text x="0" y="6" text-anchor="middle" font-size="14" font-weight="bold" fill="#000000" letter-spacing="0.5">
            Đăng nhập hệ thống
        </text>
    </g>

    <!-- ================= USE CASES: CỘT PHẢI (ADMIN) ================= -->
    <!-- UC10 -->
    <g transform="translate(720, 120)">
        <ellipse cx="0" cy="0" rx="115" ry="23" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Thống kê Dashboard</text>
    </g>
    <!-- UC11 -->
    <g transform="translate(720, 200)">
        <ellipse cx="0" cy="0" rx="118" ry="23" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Quản lý sản phẩm (CRUD)</text>
    </g>
    <!-- UC12 -->
    <g transform="translate(720, 280)">
        <ellipse cx="0" cy="0" rx="110" ry="23" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Quản lý đơn hàng</text>
    </g>
    <!-- UC13 (INCLUDED) -->
    <g transform="translate(720, 360)">
        <ellipse cx="0" cy="0" rx="118" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8" stroke-dasharray="4 2"/>
        <text x="0" y="5" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#000000">Cập nhật trạng thái đơn</text>
    </g>
    <!-- UC14 -->
    <g transform="translate(720, 440)">
        <ellipse cx="0" cy="0" rx="112" ry="23" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Quản lý khách hàng</text>
    </g>
    <!-- UC15 -->
    <g transform="translate(720, 620)">
        <ellipse cx="0" cy="0" rx="100" ry="22" fill="#ffffff" stroke="#000000" stroke-width="1.8"/>
        <text x="0" y="5" text-anchor="middle" font-size="13" font-weight="bold" fill="#000000">Đăng xuất hệ thống</text>
    </g>
</svg>
